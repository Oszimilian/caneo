syntax = "proto3";

package caneo;

message RawCanFrame {
  string interface    = 1;
  uint32 can_id       = 2;
  uint32 dlc          = 3;
  bytes  data         = 4;
  int64  timestamp_us = 5;
}

message SubscribeRequest {
  string interface = 1;  // empty = all interfaces
}

message SendResult {
  bool ok = 1;
}

message LogControlRequest {}

message LogStatus {
  bool   active = 1;
  string path   = 2;
}

service CanStream {
  rpc Subscribe(SubscribeRequest)  returns (stream RawCanFrame);
  rpc Send(RawCanFrame)            returns (SendResult);
  rpc StartLog(LogControlRequest)  returns (LogStatus);
  rpc StopLog(LogControlRequest)   returns (LogStatus);
  rpc GetLogStatus(LogControlRequest) returns (LogStatus);
}
