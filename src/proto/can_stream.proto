syntax = "proto3";

package caneo;

message RawCanFrame {
  string interface    = 1;
  uint32 can_id       = 2;
  uint32 dlc          = 3;
  bytes  data         = 4;
  int64  timestamp_us = 5;
  bool   fd           = 6;  // CAN FD frame
  bool   brs          = 7;  // CAN FD bit rate switch
}

message SubscribeRequest {
  string interface = 1;  // empty = all interfaces
}

message SendResult {
  bool ok = 1;
}

message LogControlRequest {}

message ListInterfacesRequest {}

// One CAN channel of the server (as opened by caneo there).
message InterfaceInfo {
  string name          = 1;
  uint32 bitrate       = 2;  // 0 = unknown / virtual
  uint32 data_bitrate  = 3;  // CAN FD data phase, 0 = not set
  bool   fd            = 4;
  string state         = 5;  // operstate of the interface ("up", "down", "missing")
}

// Reset HW: channels down + up (CAN controller restart, clears bus-off / error counters).
message ResetRequest {
  repeated string interfaces = 1;  // empty = all channels of the server
}

message ResetResult {
  bool   ok    = 1;
  string error = 2;
}

message InterfaceList {
  repeated InterfaceInfo interfaces = 1;
  string                 host       = 2;  // host name of the server
}

message LogStatus {
  bool   active = 1;
  string path   = 2;
}

service CanStream {
  rpc Subscribe(SubscribeRequest)  returns (stream RawCanFrame);
  rpc Send(RawCanFrame)            returns (SendResult);
  rpc StartLog(LogControlRequest)  returns (LogStatus);
  rpc StopLog(LogControlRequest)   returns (LogStatus);
  rpc GetLogStatus(LogControlRequest) returns (LogStatus);
  rpc ListInterfaces(ListInterfacesRequest) returns (InterfaceList);
  rpc ResetInterfaces(ResetRequest) returns (ResetResult);
}
