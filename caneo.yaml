# caneo configuration - written by caneo, comments are not preserved
virtual: true
log_file_path: ~/Dokumente/Logs
gui:
  scale: 1
  theme: light
logging:
  format: mcap
  raw: true
  update_ratio: true
  min_interval_ms: 0
  flush_s: 10
interfaces:
  can3:
    dbc: /home/maximilian/Git/fse_datenbasen_2713/can3.dbc
    baudrate: 1000000
graphs:
  - name: Federweg
    window_s: 30
    auto_y: true
    signals:
      - interface: can0
        msg: damper_sensor_rear
        signal: damper_rear_ch2
      - interface: can0
        msg: damper_sensor_front
        signal: damper_front_ch0
  - name: Graph 2
    window_s: 30
    auto_y: true
    signals:
      - interface: can3
        msg: CAN_IF_SPEED_Y
        signal: CAN_IF_TRACKED_SPEED
  - name: Graph 3
    window_s: 30
    auto_y: true
    signals:
      - interface: __guards__
        signal: flow/Test/scope4
      - interface: can3
        msg: RFC4800_LWS
        signal: LWS_Sensor
        y_axis: 1
