MACHINE = "raspberrypi5"
DISTRO = "poky"
INIT_MANAGER = "systemd"

# 16 cores / 15 GB RAM on the build host: limit parallelism to avoid OOM
BB_NUMBER_THREADS = "8"
PARALLEL_MAKE = "-j 8"

DL_DIR = "${TOPDIR}/../cache/downloads"
SSTATE_DIR = "${TOPDIR}/../cache/sstate"
TMPDIR = "${TOPDIR}/tmp"

PACKAGE_CLASSES = "package_ipk"
SDKMACHINE = "x86_64"
IMAGE_FSTYPES = "wic.bz2 wic.bmap"
LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch commercial"

# Serial console on the 3-pin debug UART / GPIO14/15
ENABLE_UART = "1"
# PCIe connector (M.2 HAT with PCAN-M.2). The PCAN FPGA can only DMA to 32-bit addresses;
# without pcie-32bit-dma-pi5 peak_pciefd fails with "dmam_alloc_coherent failure" (-12)
RPI_KERNEL_DEVICETREE_OVERLAYS:append = " overlays/pcie-32bit-dma-pi5.dtbo"
RPI_EXTRA_CONFIG = "\n# PCAN-M.2 on the PCIe FPC connector\ndtparam=pciex1\ndtoverlay=pcie-32bit-dma-pi5\n"

# Disk space monitor
BB_DISKMON_DIRS ??= "STOPTASKS,${TMPDIR},1G,100K STOPTASKS,${DL_DIR},1G,100K STOPTASKS,${SSTATE_DIR},1G,100K HALT,${TMPDIR},100M,1K HALT,${DL_DIR},100M,1K HALT,${SSTATE_DIR},100M,1K"
CONF_VERSION = "2"
